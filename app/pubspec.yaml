name: ciudadalerta
description: "CiudadAlerta - Proyecto Guia de Aplicaciones Moviles I (SIS-0180). Navegación con go_router (HU-02), lista de reportes (HU-03), detalle (HU-04) y formulario validado (HU-05). Clase 4."
publish_to: 'none'
version: 0.3.0+1

environment:
  # Version congelada del curso (FVM). Ver docs/07-convenciones-git.md
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Dia 4: navegación declarativa (rutas, parámetros y ShellRoute)
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
