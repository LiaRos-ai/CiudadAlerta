name: ciudadalerta
description: "CiudadAlerta - Proyecto Guia de Aplicaciones Moviles I (SIS-0180). Arquitectura por capas con Riverpod (Clase 6), borradores locales (HU-07) y el flujo del Sprint 1 (HU-01..HU-06)."
publish_to: 'none'
version: 0.7.0+1

environment:
  # Version congelada del curso (FVM). Ver docs/07-convenciones-git.md
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Dia 4: navegación declarativa (rutas, parámetros y ShellRoute)
  go_router: ^14.2.0
  # Dia 6: estado global declarativo (Sprint 2 - Hito 2)
  flutter_riverpod: ^2.5.1
  # Dia 6 / HU-07: persistencia local de borradores (clave-valor)
  shared_preferences: ^2.2.3
  # Dia 8 / HU-09-HU-10: cliente de Supabase (API REST autogenerada)
  supabase_flutter: ^2.5.0
  # Dia 8 / HU-13: gráfico de barras para las estadísticas
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
