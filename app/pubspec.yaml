name: ciudadalerta
description: "CiudadAlerta - Proyecto Guia de Aplicaciones Moviles I (SIS-0180). Arquitectura por capas con Riverpod (Clase 6), borradores locales (HU-07) y el flujo del Sprint 1 (HU-01..HU-06)."
publish_to: 'none'
version: 1.3.0+5

environment:
  # Version congelada del curso (FVM). Ver docs/07-convenciones-git.md
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Dia 4: navegación declarativa (rutas, parámetros y ShellRoute)
  go_router: ^14.2.0
  # Dia 6: estado global declarativo (Sprint 2 - Hito 2)
  flutter_riverpod: ^2.5.1
  # Dia 6 / HU-07: persistencia local de borradores (clave-valor)
  shared_preferences: ^2.2.3
  # Dia 8 / HU-09-HU-10: cliente de Supabase (API REST autogenerada)
  supabase_flutter: ^2.5.0
  # Dia 8 / HU-13: gráfico de barras para las estadísticas
  fl_chart: ^0.68.0
  # Dia 9 / HU-08: sesión segura (Keystore/Keychain) para el token de la demo
  flutter_secure_storage: ^9.2.2
  # Dia 9 / HU-11: recursos nativos - cámara y galería con sus permisos
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # Dia 11 / Sprint 3: cliente REST para APIs externas (clima Open-Meteo)
  http: ^1.2.2
  # Dia 12 / HU-14: SDK de Google Maps (marcadores y ventana emergente)
  google_maps_flutter: ^2.10.0
  # Dia 13 / HU-15 y HU-20: GPS, geocoding inverso y ruta con la app de Maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  # Dia 14 / HU-16: reconocimiento de voz (motor del sistema, en contexto)
  speech_to_text: ^7.4.0
  # Dia 14 / HU-19: texto a voz (accesibilidad, costo cero on-device)
  flutter_tts: ^4.0.2
  # Dia 14 / HU-17: notificaciones locales (aviso de estado en el dispositivo)
  flutter_local_notifications: ^17.2.2
  # Dia 14 / HU-17: push con FCM (token por usuario). Sin
  # google-services.json la app SIGUE funcionando: el servicio se
  # auto-deshabilita con try/catch (deterioro elegante, docs/60).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Día 10 / HU-12: ícono y splash nativos del paquete instalable
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

# Día 10 / HU-12: ícono adaptativo generado desde el pin 1024px
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0F1913"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

# Día 10 / HU-12: splash nativa con la marca y el color del tema oscuro
flutter_native_splash:
  color: "#0F1913"
  image: assets/icon/splash.png
  android_12:
    color: "#0F1913"
    image: assets/icon/splash.png
